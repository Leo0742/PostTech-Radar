    отзыв на странице о доставке.   Я ждала ответа от сотрудников по полдня, каждый раз писал новый сотрудник, отвечая не
    на мой вопрос, а на какой-то свой. Причем напоминать о себе приходилось несколько раз. Простой ответ о том, что написать
    отзыв не может отправитель, но только получатель посылки, я получила только через три дня. Несмотря на то, что я выполняла
    все требования операторов, присылала скриншоты и т.д. Я потратила хренову тучу времени и нервов. А отзыв я хотела написать
    о безобразной доствке, которая должна была быть срочной по условиям,но была вдвое дольше. И страдающий от болей старик  дней
    ждал свое лекарство.   --  с уважением, Тина Г--- Присоединяйтесь к нам: F---/vaotg/'
  - 'Тема письма: Возможность пользоваться ПЭП  Текст письма: Здравствуйте.  Не могу пользоваться оформленной ПЭП по причине
    того, что Ваше приложение не работает на устройстве без Google сервисов, т.е. на любой альтернативной сборке Android -
    LineageOS, /e/ OS, GrapheneOS и т.д. Я понимаю, что данные вариации Android довольно нишевые, но, поскольку теперь QR
    код обязателен и код по SMS приходить перестал, я на своем устройстве без Google сервисов никак не могу получать и отправлять
    посылки по упрощенной процедуре.   Поэтому убедительная просьба к вашим разработчикам: сделайте привязку к Google сервисам
    опциональной, первостепенные функции приложения (генерация QR кода и список отправлений) не должны зависеть от них (тем
    более, что эти сервисы от иностранного поставщика, что не есть хорошо в текущей мировой обстановке).    С уважением, Александр.'
  - 'Тема письма: Акция с промокодами/Клиент не может оплатить промокодом/промокод исчез из МП Текст письма: Тематика: Акции
