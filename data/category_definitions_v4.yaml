  - Вносим Предложение по внедрению ПЕРЕКЛЮЧЕНИЯ Аккаунтов в Приложении. Будет очень удобно пользоваться внутри семьи, чтобы
    -летнего отца не тащить в отделение Почты России.
  - 'доброе утро, коллеги, поступила жалоба на МП, прошу прокомментировать, что можно ответить клиенту.Тема: Проблема мобильного
    приложения  Текст: Уважаемые разработчики ПО, Есть серьезная  недоработка в мобильном приложении Почты России – после
    отказа в резервировании ячейки АПС для моей посылки (трек-номер  заказ с АлиЭкспресс) в почтамате отделения связи () статус
    этого отправления изменился с доставленного в отделение  на как вновь находящийся в пути (индекс , что можно интерпретировать,
    как возврат в сортировочный центр), а не как просто переданный в отдел доставки того же отделения связи для выдачи в обычном
    порядке через оператора. Последнее было установлено во  время специального посещения отделения связи .. в целях прояснения
    сложившейся запутанной ситуации. На месте было подтверждено, что данное отправление все это время с  марта ожидало выдачи
    в данном отделении (в отделе доставки), но получатель об  этом не был информирован. «Проблемное» отправление было незамедлительно
    вручено. По причине недостоверного информирования получателя о статусе его отправления на финальной стадии доставки есть
    риск потерять заказ из-за истечения установленного срока хранения  (добродушно полагая, что отправление все еще в пути
    и Почта России дополнительно известит о готовности к его выдаче) и получить ненужное длительное разбирательство с почтой
    и торговой площадкой, кто виноват и кто будет компенсировать нанесенный ущерб. Любезно  прошу обратить внимание на эту
    существующую техническую проблему (для получателя отправления отказ в резервировании ячейки АПС это факультатив или необязательная
    информация, важнее – где после этого посылка? «В пути» означает, что она еще не готова к выдаче). С уважением Сергей Дергачев 
    заранее спасибо.'
  - 'RP  Щ-- А--- ---  Здравствуйте, почему так кособоко написано в  приложении? Зачем в заблуждение вводите? о таможенном
